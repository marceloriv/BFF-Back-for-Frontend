spring:
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  application:
    name: bff-back-for-frontend

server:
  port: 8081

gateway:
  base-url: ${GATEWAY_BASE_URL:http://localhost:8222}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, threaddump
  endpoint:
    health:
      show-details: always
