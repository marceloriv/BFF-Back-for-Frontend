services:
  app:
    build: .
    container_name: bff-back-for-frontend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: ${SPRING_CONFIG_IMPORT:-optional:configserver:http://host.docker.internal:8888}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://host.docker.internal:8222}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "8081:8081"